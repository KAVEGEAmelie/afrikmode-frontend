<header class="header" [class.header-hidden]="!isHeaderVisible">
    <div class="container">
      <div class="header-content">
       <!-- Logo avec effets spectaculaires -->
<div class="logo">
  <div class="logo-glow"></div>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  <a routerLink="/">
    <span class="logo-text">AfrikMode</span>
  </a>
</div>
  
        <!-- Barre de recherche -->
        <div class="search-bar">
          <input 
            type="text" 
            placeholder="Rechercher des produits..."
            class="search-input"
          />
          <button class="search-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </button>
        </div>
  
        <!-- Actions utilisateur -->
        <div class="header-actions">
          <!-- Wishlist -->
          <a routerLink="/wishlist" class="action-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
            </svg>
            <span *ngIf="(wishlistCount$ | async) as count" class="badge">{{ count }}</span>
          </a>
  
          <!-- Panier -->
          <a routerLink="/cart" class="action-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>
            <span *ngIf="(cartCount$ | async) as cart" class="badge">{{ cart.total_items || 0 }}</span>
          </a>
  
          <!-- Compte utilisateur -->
          <div *ngIf="(isAuthenticated$ | async); else guestMenu" class="user-menu">
            <button class="action-btn" (click)="toggleUserMenu()">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
            </button>
            <div class="dropdown-menu" [class.show]="showUserMenu">
              <a routerLink="/profile" class="dropdown-item" (click)="showUserMenu = false">Mon profil</a>
              <a routerLink="/orders" class="dropdown-item" (click)="showUserMenu = false">Mes commandes</a>
              <a routerLink="/wishlist" class="dropdown-item" (click)="showUserMenu = false">Mes favoris</a>
              <button (click)="logout()" class="dropdown-item logout-btn">Déconnexion</button>
            </div>
          </div>
  
          <ng-template #guestMenu>
            <a routerLink="/login" class="btn-login">Login</a>
          </ng-template>
        </div>
      </div>
    </div>
  </header>
